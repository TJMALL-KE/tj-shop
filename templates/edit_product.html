{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4">Edit Product</h2>
        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (KSh)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="Electronics" {% if product.category == 'Electronics' %}selected{% endif %}>Electronics</option>
                    <option value="Fashion" {% if product.category == 'Fashion' %}selected{% endif %}>Fashion (Shoes, Clothes)</option>
                    <option value="Home & Living" {% if product.category == 'Home & Living' %}selected{% endif %}>Home & Living</option>
                    <option value="Beauty" {% if product.category == 'Beauty' %}selected{% endif %}>Beauty & Health</option>
                    <option value="Sports" {% if product.category == 'Sports' %}selected{% endif %}>Sports</option>
                    <option value="Other" {% if product.category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Current Photo</label><br>
                {% if product.image_url %}
                    <img src="{{ url_for('static', filename=product.image_url) }}" style="height: 150px; object-fit: contain; background-color: #f8f9fa;" class="mb-2 rounded border p-1">
                {% else %}
                    <p class="text-muted">No image uploaded.</p>
                {% endif %}
                
                <label class="form-label mt-2">Upload New Photo (optional)</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            
            <button type="submit" class="btn btn-success w-100">Update Product</button>
            <a href="/" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
{% endblock %}
