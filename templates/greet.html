{% extends 'base.html' %}

{% block content %}
    <div class="text-center mt-5">
        <h2>Enter your name:</h2>
        <form method="POST" class="mt-3">
            <input type="text" name="name" placeholder="Your name" required class="p-2" style="border: 1px solid #ccc; border-radius: 5px;">
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
        
        {% if message %}
            <h3 class="mt-4 text-success">{{ message }}</h3>
        {% endif %}
    </div>
{% endblock %}
