{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Create a Seller Account</h2>
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Full Name / Business Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="e.g. 0712 345 678" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Register</button>
            <p class="text-center mt-3">Already have an account? <a href="/seller_login">Login here</a></p>
        </form>
    </div>
{% endblock %}
