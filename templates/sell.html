{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">💼 Sell on TJ Shop</h2>
        <p class="text-muted text-center mb-4">Fill in the details below to list your product. Our team will review it and publish it shortly.</p>
        
        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
            <h5 class="mb-3 text-secondary">Product Details</h5>
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Nike Air Max" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (KSh)</label>
                <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 4500" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="">Select a category...</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion (Shoes, Clothes)</option>
                    <option value="Home & Living">Home & Living</option>
                    <option value="Beauty">Beauty & Health</option>
                    <option value="Sports">Sports</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Short description of the product..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Product Photo</label>
                <input type="file" name="image" class="form-control" accept="image/*" required>
                <small class="text-muted">Max size: 16MB. JPG or PNG.</small>
            </div>

            <hr class="my-4">

            <h5 class="mb-3 text-secondary">Your Contact Details</h5>
            <div class="mb-3">
                <label class="form-label">Your Name / Business Name</label>
                <input type="text" name="seller_name" class="form-control" placeholder="e.g. John Kamau" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Your Phone Number</label>
                <input type="tel" name="seller_phone" class="form-control" placeholder="e.g. 0712 345 678" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 btn-lg mt-3">Submit Product for Review</button>
        </form>
    </div>
{% endblock %}
