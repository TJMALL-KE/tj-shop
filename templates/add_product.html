{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4">Add a New Product</h2>
        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. HP Laptop" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (KSh)</label>
                <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 45000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="">Select a category...</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion (Shoes, Clothes)</option>
                    <option value="Home & Living">Home & Living</option>
                    <option value="Beauty">Beauty & Health</option>
                    <option value="Sports">Sports</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Short description..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Product Photo</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-success w-100">Save Product</button>
        </form>
    </div>
{% endblock %}
